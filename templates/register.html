<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati-Aegis</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <img src="/static/images/logo.png" alt="Logo Aegis" class="logo">
        <h1>Crea un account</h1>
        <a href="/">Torna alla home</a>
    </header>
    <main>
        <section>
            <h2>Inserisci i tuoi dati</h2>
            <form id="form-register" method="POST">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>

                <label for="cognome">Cognome</label>
                <input type="text" id="cognome" name="cognome" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <p id="messaggio-errore" role="alert" hidden></p>

                <button type="submit" class="btn-primario">Registrati</button>
            </form>

            <p>Hai già un account? <a href="/login">Accedi qui</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Aegis - Progetto di Tecnologie Web</p>
    </footer>
    <script src="/static/register.js"></script>   <!-- collega lo script di registrazione -->
</body>
</html>
