<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi-Aegis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Logo Aegis" class="logo">
        <h1>Bentornato!</h1>
        <a href="index.html">Torna alla home</a>
    </header>
    <main>
        <section>
            <h2>Inserisci le tue credenziali</h2>
            <form id="form-login" method="POST">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <p id="messaggio-errore" role="alert" hidden></p>

                <button type="submit" class="btn-primario">Accedi</button>
            </form>

            <p>Non hai ancora un account? <a href="register.html">Registrati qui</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Aegis - Progetto di Tecnologie Web</p>
    </footer>
    <script src="login.js"></script>   <!-- collega lo script di controllo login -->
</body>
</html>
