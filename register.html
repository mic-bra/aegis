<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati - Aegis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Logo Aegis" class="logo">
        <h1>Unisciti ad Aegis!</h1>
        <a href="index.html">Torna alla mappa</a>
    </header>

    <main>
        <section>
            <h2>Crea il tuo account</h2>
            <form method="POST">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>

                 <label for="cognome">Cognome</label>
                <input type="text" id="cognome" name="cognome" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="8" required>

                <button type="submit">Registrati</button>
            </form>

            <p>Hai già un account? <a href="login.html">Accedi qui</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Aegis - Progetto di Tecnologie Web</p>
    </footer>
</body>
</html>
