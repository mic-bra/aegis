<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Aegis- Accessibilità nei trasporti</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">   <!--  carica da internet le regole grafiche già pronte di leaflet, servono per la mappa -->
    <link rel="stylesheet" href="style.css">                                          <!--  collega il mio file.css -->
</head>
<body>
    <header>
              <img src="images/logo.png" alt="Logo Aegis" class="logo">
              <h1>Aegis</h1>
           <h2>Own your path</h2>
           <p>Segnalazione e monitoraggio
              dell'accessibilità nelle stazioni e nei trasporti
               pubblici</p>
        <nav>
            <ul>
                <li><a href="#" id="link-mappa">Mappa</a></li>
                <li><a href="#" id="link-segnala">Segnala</a></li>
                <li> <a href="login.html">Accedi</a></li>
                <li> <a href="register.html">Registrati</a></li>
            </ul>
        </nav>
    </header>
<main>
           <section id="sezione-mappa" hidden>
           <h2>Mappa e stato
            dell'accessibilità</h2>
         <form method="GET">
            <label for="cerca-stazione">Cerca stazione o fermata</label>
            <input type="search" id="cerca-stazione" name="q" placeholder="Es. Napoli Garibaldi">
            <button type="submit">Cerca</button>
         </form>

        <div id="map"></div>
    </section>
            <section id="sezione-segnala" hidden>
            <h2>Segnala un guasto o una barriera</h2>
            <form method="POST">
                <label for="stazione">Nome della stazione</label>
                <input type="text" id="stazione" name="stazione" required>

                <label for="descrizione">Descrizione del problema</label>
                <textarea id="descrizione" name="descrizione" required></textarea>

                <button type="submit">Invia segnalazione</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Aegis - Progetto di Tecnologie Web</p>
    </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>   <!-- legge prima tutto l'HTML e poi avvia lo script -->
    <script src="script.js"></script>
</body>
</html>
